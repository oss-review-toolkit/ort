; All versions are pinned exactly, including transitive libraries, so that the expected result of the functional test
; does not change when new versions are published. Note that "platform_packages" must only override packages that the
; platform itself manages: PlatformIO Core replaces an override of a Core-managed tool like "tool-scons" with its own
; required version, after which that tool is no longer listed by "pio pkg list --only-platforms".
[env]
platform = atmelavr@5.3.0
platform_packages =
	platformio/framework-arduino-avr@5.4.0
	platformio/toolchain-atmelavr@1.70300.191015

[env:uno]
board = uno
framework = arduino
lib_deps =
	bblanchon/ArduinoJson@6.21.6
	adafruit/Adafruit SSD1306@2.5.17
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit BusIO@1.17.4
