# Defines the direct successors for base-license-ids from the SPDX license list
# which implies a (transitive) successor graph used by SpdxOrLaterLicenseMapper for
# checking whether a given license identifier satisfies a given requirement. For example,
# 'GPL-2.0: GPL-1.0' ensures that a GPL-2.0 offer satisfies a GPL-1.0+ requirement.
# Format: <successor-base-license-d>: <direct-predecessor-base-llicense-id>
# Base-license-ids have any '+', 'or-later' or '-only' suffix removed.

# Sort the entries below via IntelliJ's "Edit" -> "Sort Lines".
